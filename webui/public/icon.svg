<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" fill="none">
  <defs>
    <!-- Cyrene Signature Brand Gradient: #2dd4bf -> #06b6d4 -> #6366f1 -> #8b5cf6 -->
    <linearGradient id="cyrene-liquid" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Specular Bevel Reflection -->
    <linearGradient id="cyrene-specular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Router Singularity Core -->
    <linearGradient id="cyrene-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Monolithic Hexagonal "C" Gateway Portal -->
  <path
    d="M 27.69 9.25 L 16 2.5 L 4.31 9.25 L 4.31 22.75 L 16 29.5 L 27.69 22.75 L 22.5 19.75 L 16 23.5 L 9.5 19.75 L 9.5 12.25 L 16 8.5 L 22.5 12.25 Z"
    fill="url(#cyrene-liquid)"
  />

  <!-- Top Specular Bevel Chamfer -->
  <path
    d="M 4.31 9.25 L 16 2.5 L 27.69 9.25"
    stroke="url(#cyrene-specular)"
    stroke-width="0.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Central Router Ingress Diamond (60° Isometric Rhombus) -->
  <polygon points="16,13.5 18.17,16 16,18.5 13.83,16" fill="url(#cyrene-core)" />
</svg>
