name: CI / PR Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test & Smoke Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: WebUI Lint, Test & Build
        run: |
          cd webui
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Go Format & Vet
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Unformatted Go code found:"
            gofmt -d .
            exit 1
          fi
          go vet ./...

      - name: Go Test with Race Detector
        run: go test -race ./...

      - name: Smoke Build Binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/arisvia/cyrene-gateway/internal/handler.version=ci-smoke" -o cyrene-gateway ./cmd/gateway/
          ./cyrene-gateway -host 127.0.0.1 -port 29999 &
          PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:29999/api/health || (kill -9 $PID && exit 1)
          kill -9 $PID
